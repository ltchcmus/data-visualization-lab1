[theme]
primaryColor = "#1d4ed8"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#eef4ff"
textColor = "#1e293b"
linkColor = "#2563eb"
borderColor = "#d6e3f0"
codeBackgroundColor = "#f1f5f9"
codeTextColor = "#1e293b"

showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "13px"
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 500, 500, 500]
linkUnderline = false

chartCategoricalColors = ["#1d4ed8", "#0891b2", "#d97706", "#dc2626", "#16a34a", "#0ea5e9", "#f59e0b"]

blueColor = "#3b82f6"
greenColor = "#10b981"
yellowColor = "#f59e0b"
orangeColor = "#f97316"
redColor = "#ef4444"
violetColor = "#0284c7"
grayColor = "#94a3b8"

dataframeBorderColor = "#d6e3f0"
dataframeHeaderBackgroundColor = "#f1f5f9"

[theme.sidebar]
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#eef4ff"
codeBackgroundColor = "#f1f5f9"
textColor = "#1e293b"
borderColor = "#d6e3f0"
primaryColor = "#1d4ed8"
